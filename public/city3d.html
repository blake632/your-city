<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#05070d; --ink:#f3f0e9; --muted:#a6acba; --gold:#dcbb73; --gold2:#b8924a;
  --edge:rgba(220,187,115,.4);
  --serif:"Cormorant Garamond",Georgia,serif; --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#05070d; } }
:root[data-theme="dark"]{ --bg:#05070d; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased; }
#app{ position:fixed; inset:0; overflow:hidden; background:var(--bg); }
#c{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; outline:none; }
#c.drag{ cursor:grabbing; } #c.hot{ cursor:pointer; }
#leaders{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
#leaders line{ stroke:rgba(255,236,204,.5); stroke-width:1; }
#leaders circle{ fill:#fff1d6; }
#labels,#bubbles{ position:absolute; inset:0; pointer-events:none; }
.sign{ position:absolute; left:0; top:0; pointer-events:auto; display:flex; align-items:center; gap:7px; padding:6px 11px 6px 9px; border-radius:999px;
  border:1px solid color-mix(in srgb,var(--c) 62%,transparent); background:linear-gradient(180deg,rgba(20,24,38,.93),rgba(7,9,16,.93)); color:#f7f4ee;
  font:600 11.5px/1 var(--sans); letter-spacing:.025em; white-space:nowrap; cursor:pointer; will-change:transform;
  box-shadow:0 0 16px -4px color-mix(in srgb,var(--c) 80%,transparent),0 4px 14px rgba(0,0,0,.55); transition:opacity .35s, box-shadow .2s, border-color .2s; }
.sign i{ width:7px; height:7px; flex:none; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c); }
.sign.ceo{ font-size:12.5px; padding:7px 13px 7px 10px; border-color:var(--gold); color:#fff6e2; }
.sign:hover,.sign.hot,.sign:focus-visible{ border-color:var(--c); box-shadow:0 0 24px -2px var(--c),0 4px 14px rgba(0,0,0,.55); outline:none; }
.sign.off{ opacity:0; pointer-events:none; }
.bub{ position:absolute; left:0; top:0; width:max-content; max-width:210px; padding:7px 11px 8px; border-radius:11px; background:rgba(9,12,21,.93);
  border:1px solid rgba(255,255,255,.09); border-top:2px solid var(--c); box-shadow:0 10px 26px rgba(0,0,0,.5); color:#f6f3ec; will-change:transform; transition:opacity .4s; }
.bub .who{ font:600 9.5px/1.25 var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--c); margin-bottom:2px; white-space:nowrap; }
.bub .who span{ color:#9aa1b1; font-weight:500; }
.bub .txt{ font:500 12.5px/1.35 var(--sans); transition:opacity .3s; }
.bub.off{ opacity:0; }
#tag{ position:absolute; left:0; top:0; pointer-events:none; padding:6px 10px 7px; border-radius:10px; background:rgba(9,12,21,.95); border:1px solid var(--edge);
  font:600 12px/1.3 var(--sans); white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.55); z-index:6; }
#tag small{ display:block; font-weight:500; font-size:10.5px; color:var(--muted); }
#tag em{ display:block; font-style:normal; font-weight:500; font-size:10.5px; color:var(--gold); }
#hud{ transition:opacity .4s; position:absolute; left:20px; top:18px; display:flex; align-items:center; gap:12px; pointer-events:none; z-index:4; }
.mark{ width:42px; height:42px; flex:none; border:1px solid var(--gold2); display:grid; place-items:center; font:500 17px/1 var(--serif); color:var(--gold); background:rgba(5,7,13,.5); }
.kick{ font:600 9.5px/1 var(--sans); letter-spacing:.24em; text-transform:uppercase; color:#c9ccd6; }
#hud h1{ margin:4px 0 0; font:500 31px/1 var(--serif); letter-spacing:.01em; text-shadow:0 2px 14px rgba(0,0,0,.6); }
#hud h1 em{ color:var(--gold); font-style:italic; }
.pill{ display:inline-block; margin-top:7px; font:600 9px/1 var(--sans); letter-spacing:.16em; text-transform:uppercase; color:var(--gold); border:1px solid var(--edge); padding:5px 8px; border-radius:999px; background:rgba(5,7,13,.55); }
#hint{ position:absolute; left:50%; bottom:14px; transform:translateX(-50%); font:500 11px/1 var(--sans); letter-spacing:.08em; color:#c8ccd6; background:rgba(6,8,15,.66);
  border:1px solid rgba(255,255,255,.08); padding:8px 14px; border-radius:999px; white-space:nowrap; pointer-events:none; transition:opacity .4s; z-index:4; }
#inside{ position:absolute; left:0; right:0; top:0; display:flex; align-items:center; gap:16px; padding:16px 20px 28px; z-index:5;
  background:linear-gradient(180deg,rgba(5,7,13,.9),rgba(5,7,13,0)); transition:opacity .4s; }
#inside[hidden]{ display:none; }
#back{ appearance:none; flex:none; border:1px solid var(--gold); background:rgba(8,10,18,.92); color:var(--ink); font:600 11.5px/1 var(--sans); letter-spacing:.14em;
  text-transform:uppercase; padding:12px 16px 12px 13px; border-radius:999px; cursor:pointer; display:flex; gap:8px; align-items:center; box-shadow:0 0 18px -6px var(--gold); }
#back:hover,#back:focus-visible{ background:var(--gold); color:#0b0d14; outline:none; }
#back svg{ width:14px; height:14px; }
.it .k{ font:600 9.5px/1 var(--sans); letter-spacing:.22em; text-transform:uppercase; color:var(--gold); }
.it h2{ margin:4px 0 0; font:500 27px/1.05 var(--serif); }
.it p{ margin:3px 0 0; font:500 11.5px/1.3 var(--sans); color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-width:520px; }
#fallback{ position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; background:radial-gradient(900px 500px at 50% 30%,#141a33,#05070d); z-index:9; }
#fallback[hidden]{ display:none; }
#fallback h2{ font:500 34px/1 var(--serif); margin:0 0 12px; } #fallback h2 em{ color:var(--gold); }
#fallback p{ max-width:440px; margin:0 auto; color:var(--muted); font-size:14px; line-height:1.5; }
.sign b{ min-width:18px; height:18px; margin:-3px -5px -3px 1px; padding:0 5px; border-radius:9px; background:#c9a06a; color:#15130f; font:600 10.5px/18px var(--sans); text-align:center; box-shadow:0 0 10px -2px #c9a06a; }
.sign b[hidden]{ display:none; }
.sign.live i{ animation:live 1.6s ease-in-out infinite; }
@keyframes live{ 50%{ box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 30%,transparent),0 0 12px var(--c); } }
.sign.add{ border-style:dashed; background:rgba(8,10,18,.75); color:var(--gold); }
#marks,#qbubs{ position:absolute; inset:0; pointer-events:none; z-index:4; }
.mark3{ position:absolute; left:0; top:0; width:36px; height:36px; padding:0; border:0; background:none; pointer-events:auto; cursor:pointer; will-change:transform; }
.mark3 i{ display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; font:800 22px/1 var(--sans); font-style:normal; color:#1a1100;
  background:radial-gradient(circle at 35% 30%,#fff6b8,#ffd23f 55%,#d99a00); box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 20px 5px rgba(255,210,63,.6); animation:bob 1.4s ease-in-out infinite; }
.mark3.q i{ color:#fff; background:radial-gradient(circle at 35% 30%,#ffc2da,#ff5a9a 55%,#c2185b); box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 20px 5px rgba(255,90,154,.55); }
.mark3 b{ position:absolute; top:-7px; right:-9px; min-width:19px; height:19px; padding:0 4px; border-radius:10px; background:#07090f; color:#ffd23f; border:1px solid currentColor; font:700 10.5px/17px var(--sans); }
@keyframes bob{ 50%{ transform:translateY(-6px); } }
.qbub{ position:absolute; left:0; top:0; width:max-content; max-width:230px; padding:8px 12px 9px; border-radius:12px; background:rgba(9,12,21,.94); border:1px solid rgba(255,90,154,.35); border-top:2px solid #ff5a9a;
  box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 22px -6px #ff5a9a; color:#f6f3ec; will-change:transform; pointer-events:auto; cursor:pointer; transition:opacity .4s; }
.qbub .who{ font:600 9.5px/1.25 var(--sans); letter-spacing:.09em; text-transform:uppercase; color:#ff8ab8; margin-bottom:3px; }
.qbub .txt{ font:500 12.5px/1.35 var(--sans); }
.qbub.off{ opacity:0; pointer-events:none; }
#open{ appearance:none; flex:none; margin-left:auto; border:1px solid var(--gold); background:var(--gold); color:#0b0d14; font:700 11.5px/1 var(--sans); letter-spacing:.14em; text-transform:uppercase;
  padding:12px 13px 12px 16px; border-radius:999px; cursor:pointer; display:flex; gap:6px; align-items:center; box-shadow:0 0 18px -4px var(--gold); }
#open svg{ width:14px; height:14px; }
body.clean #hint{ display:none; }
@media (max-width:560px){
  .qbub{ max-width:170px; padding:6px 9px 7px; } .qbub .txt{ font-size:11px; } .mark3,.mark3 i{ width:30px; height:30px; } .mark3 i{ font-size:18px; }
  #open{ padding:10px 10px 10px 12px; font-size:10.5px; }
  #inside{ flex-wrap:wrap; row-gap:8px; } #inside .it{ order:3; flex-basis:100%; } #open{ order:2; }
  #hud{ left:14px; top:12px; gap:9px; } .mark{ width:34px; height:34px; font-size:14px; } #hud h1{ font-size:25px; } .kick{ font-size:8.5px; letter-spacing:.2em; }
  .pill{ margin-top:5px; font-size:8px; }
  .sign{ font-size:10px; padding:5px 8px 5px 7px; gap:5px; } .sign.ceo{ font-size:10.5px; padding:5px 9px 5px 8px; } .sign i{ width:6px; height:6px; }
  .bub{ max-width:150px; padding:6px 8px 7px; } .bub .txt{ font-size:11px; } .bub .who{ font-size:8.5px; }
  #inside{ padding:12px 14px 22px; gap:12px; } .it h2{ font-size:21px; } #back{ padding:10px 12px 10px 10px; font-size:10.5px; }
  #hint{ font-size:10px; bottom:10px; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" role="img" aria-label="Your city: a 3D night city with one building per department. Drag to rotate, scroll or pinch to zoom, tap a building to go inside."></canvas>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="labels"></div>
  <div id="bubbles" aria-live="polite"></div>
  <div id="tag" hidden></div>
  <header id="hud">
    <div class="mark" id="mark"></div>
    <div><div class="kick" id="kick"></div><h1>Your <em>City</em></h1><span class="pill" id="pill"></span></div>
  </header>
  <div id="hint">Drag to look around · Scroll or pinch to zoom · Tap a building to go inside</div>
  <div id="inside" hidden>
    <button id="back" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>Back to city</button>
    <div class="it"><div class="k">Inside</div><h2 id="inName"></h2><p id="inSub"></p></div>
    <button id="open" type="button">Open<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></button>
  </div>
  <div id="marks"></div>
  <div id="qbubs"></div>
  <div id="fallback" hidden><div><h2>Your <em>City</em></h2><p></p></div></div>
</div>
<!--CITY_DATA-->
<script src="/vendor/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const EMBED=window.parent!==window, VIDEO=/[?&]video=1/.test(location.search), CLEAN=VIDEO||/[?&]clean=1/.test(location.search);
if(CLEAN) document.body.classList.add('clean');
// Opens a page of the app: inside the app it asks the app; on its own it goes there.
function go(to){ if(EMBED) parent.postMessage({type:'go',to},location.origin); else location.href='/#'+to; }
function fail(msg){ if(EMBED) parent.postMessage({type:'no3d'},location.origin); const f=$('fallback'); f.hidden=false; f.querySelector('p').textContent=msg; $('hud').hidden=true; $('hint').hidden=true; }
if(!window.THREE){ fail("The 3D engine couldn't load, so the city can't be drawn. Check your connection and reload."); return; }
function hasGL(){ try{ const c=document.createElement('canvas'); return !!(window.WebGLRenderingContext&&(c.getContext('webgl2')||c.getContext('webgl'))); }catch(e){ return false; } }
if(!hasGL()){ fail("This city is drawn in 3D with WebGL, which isn't available in this browser. Try a current Chrome, Safari, Edge or Firefox with hardware acceleration turned on."); return; }
const canvas=$('c');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }
catch(e){ fail("This browser couldn't start WebGL, so the 3D city can't be drawn. Try another browser or turn on hardware acceleration."); return; }

// ================= basics =================
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SMALL=!VIDEO&&(Math.min(innerWidth,innerHeight)<600||matchMedia('(pointer: coarse)').matches);
renderer.setPixelRatio(VIDEO?(devicePixelRatio||1):Math.min(devicePixelRatio||1,SMALL?1.6:2));
renderer.shadowMap.enabled=!SMALL;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const ANISO=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const scene=new THREE.Scene();
const FOG=new THREE.Color('#221f42');
scene.fog=new THREE.Fog(FOG,420,1500);
const camera=new THREE.PerspectiveCamera(44,1,2,6000); camera.rotation.order='YXZ';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let seed=20260929; const rnd=()=>{ seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
const rr=(a,b)=>a+(b-a)*rnd(), pick=a=>a[Math.floor(rnd()*a.length)];
const TAU=Math.PI*2;
const ANIM=[]; // per-frame world animators (t,dt)

// materials
const MC={};
const lam=(c,o)=>{ const k='l'+c+JSON.stringify(o||{}); return MC[k]||(MC[k]=new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}))); };
const basic=(c,o)=>{ const k='b'+c+JSON.stringify(o||{}); return MC[k]||(MC[k]=new THREE.MeshBasicMaterial(Object.assign({color:c},o||{}))); };
const glow=(c,op)=>basic(c,{transparent:true,opacity:op==null?1:op,blending:THREE.AdditiveBlending,depthWrite:false});
function cvs(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c,c.getContext('2d')]; }
function tex(c,rep){ const t=new THREE.CanvasTexture(c); t.anisotropy=ANISO; if(rep){ t.wrapS=t.wrapT=THREE.RepeatWrapping; } return t; }
const BOX=(w,h,d)=>new THREE.BoxGeometry(w,h,d), CYL=(a,b,h,s)=>new THREE.CylinderGeometry(a,b,h,s||8);
const SPH=(r,ws,hs,ps,pl,ts,tl)=>new THREE.SphereGeometry(r,ws||10,hs||8,ps||0,pl==null?TAU:pl,ts||0,tl==null?Math.PI:tl);
function mesh(geo,mat,x,y,z,parent,shadow){ const m=new THREE.Mesh(geo,mat); m.position.set(x||0,y||0,z||0); if(shadow!==false&&renderer.shadowMap.enabled){ m.castShadow=true; m.receiveShadow=true; } if(parent) parent.add(m); return m; }

// geometry merge with vertex colours (one draw call per merged part)
const _e=new THREE.Euler(), _q=new THREE.Quaternion();
function P(geo,col,x,y,z,rx,ry,rz,sx,sy,sz,flat){ _e.set(rx||0,ry||0,rz||0); _q.setFromEuler(_e);
  return {geo,col,flat,m:new THREE.Matrix4().compose(new THREE.Vector3(x||0,y||0,z||0),_q.clone(),new THREE.Vector3(sx||1,sy||sx||1,sz||sx||1))}; }
function merge(parts){ const pos=[],nor=[],col=[],c=new THREE.Color();
  for(const p of parts){ const g=p.geo.index?p.geo.toNonIndexed():p.geo.clone(); g.applyMatrix4(p.m); if(p.flat) g.computeVertexNormals();
    const a=g.attributes.position.array,n=g.attributes.normal.array; c.set(p.col);
    for(let i=0;i<a.length;i++){ pos.push(a[i]); nor.push(n[i]); } for(let i=0;i<a.length/3;i++) col.push(c.r,c.g,c.b); g.dispose(); }
  const o=new THREE.BufferGeometry(); o.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); o.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3)); o.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); o.computeBoundingSphere(); return o; }
const VCOL=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide,emissive:0x161616});
const VBASIC=new THREE.MeshBasicMaterial({vertexColors:true});

// radial glow texture
function radial(stops,size){ const [c,x]=cvs(size||128,size||128), s=(size||128)/2; const g=x.createRadialGradient(s,s,0,s,s,s); stops.forEach(([o,col])=>g.addColorStop(o,col)); x.fillStyle=g; x.fillRect(0,0,s*2,s*2); return tex(c); }
const GLOWTEX=radial([[0,'rgba(255,214,150,1)'],[.25,'rgba(255,190,110,.55)'],[1,'rgba(255,170,90,0)']]);
const SOFTTEX=radial([[0,'rgba(255,255,255,1)'],[.2,'rgba(255,255,255,.7)'],[.5,'rgba(255,255,255,.15)'],[1,'rgba(255,255,255,0)']],64);

// ================= data: the owner's own departments =================
// The server puts them in CITY_DATA; /api/city3d refreshes the live parts every 20 seconds. City Hall (the Guide), the Research desk
// and the School are always there; each department the owner built is a building, its look picked from what it is called.
let DATA=window.CITY_DATA||{business:'',departments:[],hall:{need:0},research:{},school:{}};
const INIT=(()=>{ const w=String(DATA.business||'Your City').replace(/['\u2019]/g,'').replace(/[^\p{L}\p{N} ]/gu,' ').trim().split(/\s+/).filter(Boolean);
  return (w.length>1?w.filter(x=>!/^(the|and|of|a)$/i.test(x)).slice(0,3).map(x=>x[0]).join(''):(w[0]||'YC').slice(0,2)).toUpperCase(); })();
const PAL=['#3ed69b','#ff7a59','#ff5aa5','#3cb4ff','#a78bfa','#f25f6b','#a3e05e','#e39459','#2ee6c5','#f5d042'];
const SLOTS=[[1,1],[3,1],[0,1],[4,1],[1,2],[3,2],[0,2],[4,2],[1,0],[0,0]];
const KIND_TYPE={leads:'shop',mailroom:'post',social:'studio'}, ORDER=['hq','loft','round','twist','antenna','market','campus','studio','shop','post'];
const WORDS=[[/e-?mail|newsletter/i,'round'],[/brand|design|creative|logo|visual|photo/i,'twist'],[/web|seo|site|google|search/i,'antenna'],[/content|blog|writ|copy|story|article/i,'loft'],
  [/market|\bads?\b|advert|campaign|promo|growth|review/i,'hq'],[/\bapps?\b|tech|software|code|data/i,'campus'],[/shop|store|product|etsy|order|inventory/i,'market'],
  [/social|insta|tiktok|facebook|reel|video|youtube/i,'studio'],[/lead|sales|customer|client|quote|estimate/i,'shop'],[/mail|letter|file|paper|invoice/i,'post']];
const shortOf=n=>{ n=String(n); return n.length<=12?n:n.split(/\s+/)[0].slice(0,12); };
const DEPTS=[{k:'hall',name:'City Hall',short:'City Hall',col:'#e8bd62',c:2,r:1,type:'tower',sub:'The Guide: your setup, and exactly how to fix anything',go:'guide'},
 {k:'research',name:'Research Desk',short:'Research',col:'#8c95ff',c:3,r:0,type:'observatory',sub:'Finds new tools for your departments',go:'school'},
 {k:'school',name:'The School',short:'School',col:'#f0cf86',c:4,r:0,type:'bank',sub:'New tools try out here before they join a department',go:'school'}];
(()=>{ const used=new Set(['tower','observatory','bank']); (DATA.departments||[]).slice(0,SLOTS.length).forEach((x,i)=>{
  let t=KIND_TYPE[x.kind]||((WORDS.find(([re])=>re.test(x.name))||WORDS.find(([re])=>re.test(x.does||''))||[])[1])||'';
  if(!t||used.has(t)) t=ORDER.find(o=>!used.has(o))||ORDER[i%ORDER.length];
  used.add(t); DEPTS.push({k:'d'+i,id:x.id,name:x.name,short:shortOf(x.name),col:PAL[i%PAL.length],c:SLOTS[i][0],r:SLOTS[i][1],type:t,sub:x.does||'',kind:x.kind,judge:!!x.judge,go:x.id}); }); })();
const DK={}; DEPTS.forEach(d=>DK[d.k]=d);
const FREE=SLOTS.slice(DEPTS.length-3);   // empty lots, waiting for the next department
const PANEL_HOME=(DEPTS.find(d=>d.type==='studio')||DEPTS.find(d=>d.judge)||{}).k||null;   // the Panel's 8 sit outside here
const SIG=JSON.stringify([DATA.business,(DATA.departments||[]).map(x=>[x.id,x.name,x.kind,!!x.judge])]);
// the people: a small crew per building, the same faces every time (picked from the department's id)
const FIRST=['Ava','Leo','Maya','Noah','Zoe','Eli','Ivy','Omar','Lena','Kai','Ruby','Theo','Nina','Sami','Jade','Owen','Iris','Milo','Tess','Ravi','Ana','Luis','Mei','Jon'];
const LAST=['Hart','Reyes','Cole','Park','Diaz','Shah','Lowe','Nash','Wren','Moss','Vale','Okoro','Bauer','Lin','Ford','Quinn','Ortiz','Kato','Bell','Adler'];

addEventListener('resize',resize);

// ================= loop =================
let last=performance.now(), T=0, needRender=true; const GLITDIR=new THREE.Vector3(-.3,0,-1).normalize();

  { const md=GLITDIR, tt=(camera.position.z+300)/-md.z; glit.position.set(camera.position.x+md.x*tt,-0.3,-300); glit.rotation.y=Math.atan2(md.x,md.z); }

  if(!REDUCED||trans||needRender){ needRender=false; if(!REDUCED){ if(onScreen&&!document.hidden) requestAnimationFrame(frame); else sleeping=true; } else if(trans) requestAnimationFrame(frame); else rafPending=false; }
}
let labelsSeen=false, rafPending=false, onScreen=true, sleeping=false;
function wake(){ if(sleeping&&onScreen&&!document.hidden&&!VIDEO){ sleeping=false; last=performance.now(); requestAnimationFrame(frame); } }
if(window.IntersectionObserver) new IntersectionObserver(e=>{ onScreen=e[e.length-1].isIntersecting; wake(); }).observe(canvas);

// init poses for the frozen (reduced-motion) view
cityList.forEach(ch=>pose(ch,0.001)); updateCars(0.001);
resize();
const m0=location.hash.match(/^#inside-(\w+)$/);
if(m0&&DK[m0[1]]) enter(m0[1],true);
// ---------- what needs you: "!" over a building with work waiting, a pink "?" and its question over one that asks you something ----------
const marksEl=$('marks'), qEl=$('qbubs'); let MARKS=[], markSig='';
function paintMarks(){ const next=DEPTS.filter(d=>d.need||d.ask).map(d=>({d,n:d.need||0,q:d.ask||''})), sig=next.map(m=>m.d.k+':'+m.n+':'+m.q).join('|');
  if(sig===markSig) return; markSig=sig; MARKS=next; marksEl.textContent=''; qEl.textContent='';
  MARKS.forEach(m=>{ const b=document.createElement('button'); b.type='button'; b.className='mark3'+(m.q?' q':''); const i=document.createElement('i'); i.textContent=m.q?'?':'!'; b.appendChild(i);
    if(m.n>1&&!m.q){ const c=document.createElement('b'); c.textContent=m.n>9?'9+':String(m.n); b.appendChild(c); }
    b.setAttribute('aria-label',(m.q?m.d.name+' has a question for you':m.n+' waiting on you at '+m.d.name)); b.addEventListener('click',e=>{ e.stopPropagation(); go(m.d.go); });
    m.el=b; marksEl.appendChild(b);
    if(m.q){ const q=document.createElement('div'); q.className='qbub off'; const w=document.createElement('div'); w.className='who'; w.textContent=m.d.short+' asks you'; const t=document.createElement('div'); t.className='txt'; t.textContent=m.q.length>90?m.q.slice(0,88)+'…':m.q;
      q.append(w,t); q.addEventListener('click',e=>{ e.stopPropagation(); go(m.d.go); }); m.qel=q; qEl.appendChild(q); } }); }
function layoutMarks(){ const show=mode==='city'&&!trans; marksEl.hidden=qEl.hidden=!show; if(!show) return;
  MARKS.forEach(m=>{ const ch=cityChars[m.d.k+'_0']; if(ch&&isShown(ch)){ headPos(ch,_hv); _hv.y+=1.6; } else _hv.copy(m.d.anchor);
    const p=projectXY(_hv), vis=p.z<1&&p.x>-40&&p.x<VW+40&&p.y>-40&&p.y<VH+40; m.el.style.display=vis?'':'none';
    if(vis) m.el.style.transform=`translate3d(${(p.x-18).toFixed(1)}px,${(p.y-40).toFixed(1)}px,0)`;
    if(m.qel){ const a=projectXY(m.d.anchor), w=m.qel.offsetWidth, h=m.qel.offsetHeight; m.qel.classList.toggle('off',!vis);
      m.qel.style.transform=`translate3d(${clamp(a.x-w/2,6,VW-w-6).toFixed(1)}px,${clamp(a.y-h-34,6,VH-h-6).toFixed(1)}px,0)`; } }); }
// ---------- the live parts, refreshed: badges, glow, markers, what people say ----------
function refresh(){ DEPTS.forEach(d=>{ const x=dataOf(d)||{}, n=x.need||0; d.need=n; d.live=!!x.live; d.ask=x.ask||'';
    const b=d.el&&d.el.querySelector('b'); if(b){ const txt=n>9?'9+':String(n||''); if(b.textContent!==txt||b.hidden!==!n){ b.textContent=txt; b.hidden=!n; d.lab.w=d.el.offsetWidth; } }
    if(d.el){ d.el.classList.toggle('live',d.live); d.el.setAttribute('aria-label','Go inside '+d.name+(n?', '+n+' waiting on you':'')+(d.ask?', it has a question for you':'')+(d.live?', working now':'')); }
    if(REDUCED){ d.glow.material.opacity=d.live?.55:.07; d.beam.visible=d.live; } });
  const need=DEPTS.reduce((a,d)=>a+(d.id?d.need||0:0),0), n=DEPTS.filter(d=>d.id).length;
  $('mark').textContent=INIT; $('kick').textContent=DATA.business||'Your business'; $('pill').textContent=n+' department'+(n===1?'':'s')+(need?' · '+need+' need you':'');
  PANEL_NOW=DATA.panel||null; LED_TEXT=DATA.led||LED_TEXT; sayLines(); paintMarks(); requestRender(); }
async function pull(){ if(VIDEO||document.hidden) return; try{ const r=await fetch('/api/city3d',{credentials:'same-origin'}); if(!r.ok) return; const j=await r.json();
  const sig=JSON.stringify([j.business,(j.departments||[]).map(x=>[x.id,x.name,x.kind,!!x.judge])]); if(sig!==SIG){ location.reload(); return; } DATA=j; refresh(); }catch(e){} }
addEventListener('message',e=>{ if(e.origin===location.origin&&e.data&&e.data.type==='refresh') pull(); });
setInterval(pull,20000);
if(EMBED){ $('hud').hidden=true; $('hud').style.display='none'; measure(); }
refresh();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{ measure(); SIGNS.forEach(d=>d.lab.init=false); requestRender(); });
if(VIDEO){ last=performance.now(); } else if(REDUCED){ requestRender(); } else requestAnimationFrame(frame);
// For the video: step the world by hand, and point the camera at a building.
let vNow=performance.now();
function step(dt){ vNow+=dt*1000; last=vNow-dt*1000; frame(vNow); }
function look(k,o){ const d=k==='city'?null:DK[k]; o=o||{}; const s=d?{az:o.az!=null?o.az:cam.az,el:o.el!=null?o.el:.42,dist:o.dist||70,pitch:o.pitch!=null?o.pitch:.36,px:d.bx,py:o.py!=null?o.py:(d.b.h*.45),pz:d.bz}:Object.assign(cityState(),o);
  Object.assign(goal,s); if(o.snap) Object.assign(cam,s); }
window.__city={enter,exit,cam,goal,cityChars,camera,projectXY,headPos,perf,hit,showTag,step,look,refresh,DK,DEPTS,cityState,get mode(){ return mode; },get trans(){ return trans; }};
})();
